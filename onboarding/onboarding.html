<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B站稍后观看助手 - 欢迎</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon32.png">
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="container">
    <img class="logo" src="../icons/icon128.png" alt="" width="72" height="72">
    <h1>B站稍后观看助手</h1>
    <p class="subtitle">自动帮你把关注的UP主新视频加入「稍后观看」，不再错过任何更新。</p>

    <ul class="features">
      <li>自动检测追踪名单中UP主的新视频</li>
      <li>发现新视频后自动添加到稍后观看</li>
      <li>可自行增删追踪的UP主名单</li>
    </ul>

    <button class="btn btn-primary" id="import-btn">从B站关注列表导入</button>
    <button class="btn btn-secondary" id="skip-btn">稍后再说，手动添加</button>

    <div class="progress" id="progress">
      正在导入... <span id="progress-text"></span>
    </div>
    <div class="result" id="result"></div>
  </div>

  <script src="onboarding.js" type="module"></script>
</body>
</html>
