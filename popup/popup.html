<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稍后观看助手</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="heading">
        <span class="title">稍后观看助手</span>
      </div>
      <span id="status-badge" class="badge">加载中</span>
    </header>
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-val" id="stat-tracking">--</span>
        <span class="stat-label">追踪UP主</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-new">--</span>
        <span class="stat-label">本次新发现</span>
      </div>
    </div>
    <button class="btn-primary" id="btn-check">立即检查</button>
    <div class="action-row">
      <button class="btn-link" id="btn-open-wl">打开稍后观看 →</button>
      <button class="btn-link" id="btn-reimport">重新导入关注</button>
    </div>
    <button id="btn-manage" class="manage-entry" title="在新标签页打开管理中心" aria-label="打开详细管理中心">
      <span class="manage-copy"><span class="manage-title">详细管理</span><span class="manage-description">追踪名单 · 自动排程 · 导入导出</span></span>
    </button>
    <p id="feedback" role="status" hidden></p>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
