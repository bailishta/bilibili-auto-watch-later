<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稍后观看助手</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon32.png">
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="heading">
        <img class="brand-icon" src="../icons/icon128.png" alt="" width="42" height="42">
        <div><span class="title">稍后观看助手</span><span class="subtitle">Bilibili 稍后观看管理工具</span></div>
      </div>
      <span id="status-badge" class="badge">加载中</span>
    </header>
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">追踪UP主</span>
        <span class="stat-val" id="stat-tracking">--</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">本次新发现</span>
        <span class="stat-val" id="stat-new">--</span>
      </div>
    </div>
    <button class="btn-primary" id="btn-check">
      <span class="check-copy"><svg class="ui-icon" aria-hidden="true"><use href="../ui/icons.svg#play"/></svg><span id="check-label">立即检查</span></span>
      <span id="popup-progress" class="check-track" role="progressbar" aria-label="检查进度" aria-valuemin="0" aria-valuemax="100" hidden><span id="popup-progress-fill"></span></span>
    </button>
    <button class="secondary-action" id="btn-open-wl"><svg class="ui-icon" aria-hidden="true"><use href="../ui/icons.svg#external"/></svg><span>打开稍后观看</span></button>
    <button class="secondary-action" id="btn-reimport"><svg class="ui-icon" aria-hidden="true"><use href="../ui/icons.svg#refresh"/></svg><span id="reimport-label">重新导入关注</span></button>
    <button id="btn-manage" class="manage-entry" title="在新标签页打开管理中心" aria-label="打开详细管理中心">
      <svg class="ui-icon" aria-hidden="true"><use href="../ui/icons.svg#settings"/></svg><span class="manage-copy"><span class="manage-title">详细管理</span><span class="manage-description">追踪名单 · 自动排程 · 导入导出</span></span><svg class="ui-icon" aria-hidden="true"><use href="../ui/icons.svg#arrow"/></svg>
    </button>
    <p id="feedback" role="status" hidden></p>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
